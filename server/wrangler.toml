name = "godot-web-test-server"
main = "src/index.js"
compatibility_date = "2025-09-01"

# One Durable Object class; we only ever instantiate the "global" instance.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Objects are the only kind available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
