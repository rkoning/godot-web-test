name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5"
  GODOT_RELEASE: "stable"

jobs:
  export:
    name: Web export (no deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/godot-export
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          godot-release: ${{ env.GODOT_RELEASE }}

      # The battle sim runs without a renderer, so the acceptance criteria are
      # checked here rather than by eye.
      # A suite that starts, asserts a few things and then hits a runtime error
      # prints SCRIPT ERROR, returns to the discovery loop and leaves
      # `failures == 0` — a green build that tested half of what it claimed.
      # The runner cannot see that from inside, so the log is the guard.
      - name: Acceptance tests
        working-directory: game
        timeout-minutes: 15
        run: |
          set -o pipefail
          godot --headless --script tests/run_tests.gd 2>&1 | tee test.log
          ! grep -q "SCRIPT ERROR" test.log

      - name: Upload build for inspection
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build
          retention-days: 7

  server:
    name: Worker config check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
        working-directory: server

      # Builds and validates wrangler.toml without touching Cloudflare, so a
      # broken Worker fails the PR rather than the release.
      - run: npm run check
        working-directory: server
