name: Release web build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to GitHub Pages as well as building"
        type: boolean
        default: true

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.5"
  GODOT_RELEASE: "stable"

jobs:
  build:
    name: Export web build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/godot-export
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          godot-release: ${{ env.GODOT_RELEASE }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Attach zipped build to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          zip -r "web-${TAG}.zip" build
          gh release upload "$TAG" "web-${TAG}.zip" --clobber

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'release' || inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
