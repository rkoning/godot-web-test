name: "Godot web export"
description: "Installs a pinned headless Godot + export templates and exports the Web preset."

inputs:
  godot-version:
    description: "Godot version, e.g. 4.5"
    required: true
  godot-release:
    description: "Release channel suffix, e.g. stable or rc1"
    required: false
    default: "stable"
  project-path:
    description: "Directory containing project.godot"
    required: false
    default: "game"
  preset:
    description: "Name of the export preset in export_presets.cfg"
    required: false
    default: "Web"
  output-dir:
    description: "Directory the export is written to (relative to the repo root)"
    required: false
    default: "build"

runs:
  using: "composite"
  steps:
    - name: Cache Godot editor and export templates
      id: godot-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.godot-ci/bin
          ~/.local/share/godot/export_templates
        key: godot-${{ inputs.godot-version }}-${{ inputs.godot-release }}

    - name: Install Godot ${{ inputs.godot-version }}-${{ inputs.godot-release }}
      if: steps.godot-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.godot-version }}-${{ inputs.godot-release }}
        TEMPLATE_DIR_NAME: ${{ inputs.godot-version }}.${{ inputs.godot-release }}
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot-builds/releases/download/${VERSION}"
        work="$(mktemp -d)"

        echo "::group::Download editor"
        curl -fsSL -o "$work/godot.zip" "${base}/Godot_v${VERSION}_linux.x86_64.zip"
        echo "::endgroup::"

        echo "::group::Download export templates"
        curl -fsSL -o "$work/templates.tpz" "${base}/Godot_v${VERSION}_export_templates.tpz"
        echo "::endgroup::"

        mkdir -p "$HOME/.godot-ci/bin"
        unzip -q "$work/godot.zip" -d "$work/editor"
        mv "$work/editor/Godot_v${VERSION}_linux.x86_64" "$HOME/.godot-ci/bin/godot"
        chmod +x "$HOME/.godot-ci/bin/godot"

        # The .tpz is a zip whose contents live under templates/
        unzip -q "$work/templates.tpz" -d "$work/tpz"
        dest="$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR_NAME}"
        mkdir -p "$dest"
        mv "$work/tpz/templates/"* "$dest/"
        rm -rf "$work"

    - name: Add Godot to PATH
      shell: bash
      run: echo "$HOME/.godot-ci/bin" >> "$GITHUB_PATH"

    - name: Report Godot version
      shell: bash
      run: godot --headless --version

    - name: Import project assets
      shell: bash
      working-directory: ${{ inputs.project-path }}
      run: |
        # A cold checkout has no .godot/ import cache; exporting without one
        # produces an empty or broken build, so warm it first.
        godot --headless --import

    - name: Export "${{ inputs.preset }}"
      shell: bash
      env:
        OUT: ${{ github.workspace }}/${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        mkdir -p "$OUT"
        cd "${{ inputs.project-path }}"
        godot --headless --export-release "${{ inputs.preset }}" "$OUT/index.html"

    - name: Verify export output
      shell: bash
      env:
        OUT: ${{ github.workspace }}/${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        # Godot can exit 0 having written nothing useful; fail loudly instead of
        # shipping a blank page.
        for f in index.html index.js index.wasm index.pck; do
          if [ ! -s "$OUT/$f" ]; then
            echo "Missing or empty export artifact: $f" >&2
            ls -la "$OUT" >&2 || true
            exit 1
          fi
        done
        # GitHub Pages runs Jekyll on uploaded content unless told not to.
        touch "$OUT/.nojekyll"
        ls -la "$OUT"
